# Managed by Money Station
# DNS-independent HTTP staging. Enable HTTPS only after DNS and ACME succeed.
log_format money_station_access '$request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    server_name moneystation.site;
    access_log /var/log/nginx/money-station.access.log money_station_access;
    error_log /var/log/nginx/money-station.error.log warn;
    client_max_body_size 1k;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/money-station-acme;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:3330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }
}

# The API is never exposed over plaintext HTTP. This is only its ACME entry.
server {
    listen 80;
    listen [::]:80;
    server_name api.moneystation.site;
    access_log off;
    error_log /var/log/nginx/money-station-api.error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/money-station-acme;
        try_files $uri =404;
    }
    location / {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 426 '{"error":"TLS_REQUIRED"}\n';
    }
}
