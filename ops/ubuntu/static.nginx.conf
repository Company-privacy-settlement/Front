# Managed by Money Station
daemon off;
worker_processes 1;
pid /run/money-station/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format money_station_access '$request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout money_station_access;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 1k;
    client_body_timeout 10s;
    send_timeout 15s;
    client_body_temp_path /run/money-station/client;
    proxy_temp_path /run/money-station/proxy;
    fastcgi_temp_path /run/money-station/fastcgi;
    uwsgi_temp_path /run/money-station/uwsgi;
    scgi_temp_path /run/money-station/scgi;
    map $uri $money_station_cache {
        default "no-cache";
        ~^/_next/static/ "public, max-age=31536000, immutable";
    }
    server {
        listen 127.0.0.1:3330;
        server_name h2on.xyz;
        if ($host != h2on.xyz) { return 444; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        root /srv/money-station/current/public;
        index index.html;
        autoindex off;
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $money_station_cache always;
        add_header X-Money-Station-Release @RELEASE_ID@ always;
        location = /healthz {
            default_type application/json;
            return 200 '{"service":"money-station-front","status":"ok"}\n';
        }
        location ~ (^|/)\. { return 404; }
        location ~ \.vtt$ { types { text/vtt vtt; } try_files $uri =404; }
        location / { try_files $uri $uri/ =404; }
        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
