# Managed by Money Station
log_format money_station_access '$request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    server_name moneystation.site api.moneystation.site;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/money-station-acme;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name moneystation.site;
    ssl_certificate /etc/letsencrypt/live/moneystation.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moneystation.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/money-station.access.log money_station_access;
    error_log /var/log/nginx/money-station.error.log warn;
    client_max_body_size 1k;
    location / {
        proxy_pass http://127.0.0.1:3330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.moneystation.site;
    ssl_certificate /etc/letsencrypt/live/moneystation.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moneystation.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/money-station-api.error.log warn;
    client_max_body_size 8192;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    error_page 502 504 =503 @api_unavailable;
    location = /healthz/organizations { proxy_pass http://127.0.0.1:3332/healthz; }
    location = /readyz/organizations { proxy_pass http://127.0.0.1:3332/readyz; }
    location = /v1/providers/sumsub/webhook {
        client_max_body_size 65536;
        proxy_pass http://127.0.0.1:3332;
    }
    location ~ ^/v1/organizations/[a-f0-9-]+/tax-drafts(?:/[a-f0-9-]+/revise)?$ {
        client_max_body_size 131072;
        proxy_pass http://127.0.0.1:3332;
    }
    location ~ ^/v1/(?:auth|me|organizations)(?:/|$) { proxy_pass http://127.0.0.1:3332; }
    location / { proxy_pass http://127.0.0.1:3331; }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        return 503 '{"error":"API_UPSTREAM_UNAVAILABLE"}\n';
    }
}
