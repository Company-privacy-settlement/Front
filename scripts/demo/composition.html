<!doctype html><html lang="en"><meta charset="utf-8"><title>Money Station — film compositor</title><style>
@font-face{font-family:DM;src:url('assets/dm-sans.woff2') format('woff2');font-weight:100 1000}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#fff;font-family:DM,Arial,sans-serif}body.ready{background:#050807}.stage{position:absolute;inset:0;opacity:0;color:#f3f8f4;background:radial-gradient(ellipse at 60% 20%,#0d2417 0,transparent 60%),#050807}.ready .stage{opacity:1}.rails{position:absolute;inset:0;opacity:.55;pointer-events:none}.rails i{position:absolute;width:2px;background:#294a36;border-radius:2px}.rails i.active{background:#32ef9e;box-shadow:0 0 16px #32ef9e44}.veil{position:absolute;inset:0;background:linear-gradient(180deg,#05080744,transparent 40%,#050807dd)}.brand{display:flex;align-items:center;gap:13px;font-size:28px;letter-spacing:-1.4px;font-weight:550;color:#eaf9ef;white-space:nowrap}.brand svg{width:32px;height:32px;color:#32ef9e}.brand span span{font-weight:350}.brand b{font-weight:500;color:#32ef9e}.corner-brand{position:absolute;top:53px;right:77px;font-size:27px;z-index:5}.corner-brand svg{width:29px;height:29px}.film-title{position:absolute;left:78px;top:34px;font-size:57px;font-weight:450;letter-spacing:-2px;line-height:1.12;margin:0;z-index:5}.chapter-line{position:absolute;left:79px;top:118px;width:46px;height:2px;background:#32ef9e;transform-origin:left}.ui-frame{position:absolute;left:72px;top:155px;width:1776px;height:843.6px;overflow:hidden;border:1px solid #35503f;border-radius:12px;background:#101b14;box-shadow:0 30px 90px #0008}.ui-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:none}.scope{position:absolute;right:20px;bottom:14px;z-index:4;color:#8cae98;font-size:15px;letter-spacing:.1px;padding:6px 10px;background:#08120ce8;border:1px solid #284632;border-radius:4px}.scope:before{content:'';width:5px;height:5px;display:inline-block;background:#5ecd8d;border-radius:50%;margin:0 8px 2px 0}.subtitle-safe{position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(0deg,#050807,#050807d9 65%,transparent)}.graphic{position:absolute;inset:0;display:none}.graphic h1{font-size:112px;line-height:1.03;font-weight:450;letter-spacing:-5.8px;margin:0;color:#f3f8f4}.graphic h1 span{color:#a4edc5;display:block;margin-top:9px}.graphic-heading{position:absolute;top:220px;left:160px;right:150px}.graphic .g-brand{position:absolute;top:84px;left:160px;font-size:31px}.graphic .g-brand svg{width:36px;height:36px}.pain-cards{position:absolute;left:155px;right:155px;top:585px;height:248px;display:flex;align-items:center;gap:36px}.pain-card{width:410px;height:205px;padding:32px;background:#122019;border:1px solid #395744;border-radius:10px;box-shadow:0 24px 50px #0004;position:relative}.pain-card>div{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}.pain-card strong{font-size:25px;font-weight:450;letter-spacing:-.6px}.pain-card svg{width:26px;height:26px;color:#70b58c}.redaction{display:block;height:10px;width:85%;background:#49645555;border-radius:2px;margin-top:12px}.redaction.short{width:53%}.card-lock{position:absolute;right:28px;bottom:28px;width:36px;height:36px;border:1px solid #58996b66;border-radius:50%;display:grid;place-items:center;background:#1d3928;color:#a1eabc}.card-lock svg{width:18px;height:18px}.signal-line{position:absolute;height:1px;left:158px;right:158px;top:865px;background:linear-gradient(90deg,transparent,#457b53,transparent)}.signal-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#60ffab;box-shadow:0 0 25px #32ef9e;top:861px}.paper-route{position:absolute;left:155px;right:155px;top:615px;height:170px;display:flex;align-items:center;justify-content:space-between}.route-card{position:relative;z-index:2;border:1px solid #36543f;background:#111e16;border-radius:8px;width:300px;height:144px;padding:25px;display:flex;align-items:center;gap:17px;font-size:26px;box-shadow:0 25px 40px #0005}.route-card svg{width:36px;height:36px;color:#6cd397}.paper-route:before{content:'';position:absolute;left:20px;right:20px;height:1px;background:#315d40;top:72px}.brand-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding-bottom:70px}.brand-emblem{height:142px;width:142px;border:1px solid #3e8256;background:#12291b;border-radius:31px;display:grid;place-items:center;box-shadow:0 0 120px #21dc6b14;margin-bottom:35px}.brand-emblem svg{width:83px;height:83px;color:#58efa1}.brand-center>.brand{font-size:51px;letter-spacing:-2.7px;margin-bottom:55px;gap:15px}.brand-center>.brand>svg{display:none}.brand-center h1{text-align:center;font-size:105px;letter-spacing:-5.2px}.brand-center h1 span{margin-top:4px}.pillars{display:flex;gap:52px;position:absolute;bottom:162px;left:0;right:0;justify-content:center;color:#91b9a0;font-size:20px}.pillars span{display:flex;align-items:center;gap:10px}.pillars i{display:block;height:5px;width:5px;border-radius:50%;background:#3adb8b}.closing-cta{position:absolute;bottom:143px;left:0;right:0;text-align:center;color:#63e69a;font-size:24px;letter-spacing:-.4px}.closing-cta svg{width:23px;height:23px;vertical-align:-4px;margin-left:12px}.progress{position:absolute;left:0;bottom:0;height:2px;z-index:10;background:#32ef9e;opacity:.65}
</style><body><div class="stage">
<div class="rails" id="rails"></div><div class="veil"></div>
<div class="corner-brand brand" id="corner"></div><h1 class="film-title" id="headline"></h1><i class="chapter-line" id="chapter-line"></i>
<div class="ui-frame" id="frame"><span class="scope" id="scope"></span></div>
<section class="graphic" id="privacy-pain"><div class="g-brand brand"></div><div class="graphic-heading"><h1>Business is private.<span>Payments should be, too.</span></h1></div><div class="pain-cards" id="privacy-cards"></div><div class="signal-line"></div><i class="signal-dot" id="privacy-dot"></i></section>
<section class="graphic" id="paperwork-pain"><div class="g-brand brand"></div><div class="graphic-heading"><h1>Fast money.<span>Slow paperwork.</span></h1></div><div class="paper-route" id="paper-route"></div><i class="signal-dot" id="paper-dot" style="top:683px"></i></section>
<section class="graphic" id="brand"><div class="brand-center"><div class="brand-emblem"></div><div class="brand"></div><h1>Private payments.<span>Clear proof.</span></h1></div><div class="pillars"><span><i></i>Business payments</span><span><i></i>Private details</span><span><i></i>Selective evidence</span></div></section>
<section class="graphic" id="closing"><div class="brand-center"><div class="brand-emblem"></div><div class="brand"></div><h1>Business money.<span>On your terms.</span></h1></div><div class="closing-cta">Explore Money Station <svg viewBox="0 0 24 24" fill="none"><path d="M5 19 19 5M5 5h14v14" stroke="currentColor" stroke-width="1.5"/></svg></div></section>
<div class="subtitle-safe"></div><div class="progress" id="progress"></div>
</div><script>
const mark='<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M3 25V9a5 5 0 0 1 10 0v14M13 23V9a5 5 0 0 1 10 0v16M23 25V13h6v12" stroke="currentColor" stroke-width="3.8" stroke-linejoin="round"/><path d="M3 29h26" stroke="currentColor" stroke-width="2"/></svg>';
const logo=mark+'<span>money<span>station</span><b>.</b></span>';
const fileIcon='<svg viewBox="0 0 32 32" fill="none"><path d="M8 3h12l6 6v20H8V3Z M20 3v7h6M12 16h10M12 21h7" stroke="currentColor" stroke-width="1.6"/></svg>';
const eye='<svg viewBox="0 0 32 32" fill="none"><path d="M3 16s5-8 13-8 13 8 13 8-5 8-13 8S3 16 3 16Z" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="16" r="4" stroke="currentColor" stroke-width="1.5"/></svg>';
for(const el of document.querySelectorAll('.brand'))el.innerHTML=logo;
for(const el of document.querySelectorAll('.brand-emblem'))el.innerHTML=mark;
for(const [i,name] of ['Invoice','Payroll','Partners'].entries()){const el=document.createElement('div');el.className='pain-card';el.innerHTML='<div><strong>'+name+'</strong>'+eye+'</div><i class="redaction"></i><div class="redaction short"></div>';document.getElementById('privacy-cards').append(el);}
for(const [i,name] of ['Payment','Invoice','Receipt','Review'].entries()){const el=document.createElement('div');el.className='route-card';el.innerHTML=fileIcon+'<span>'+name+'</span>';document.getElementById('paper-route').append(el);}
const rails=[];for(let i=0;i<67;i++){const el=document.createElement('i');el.style.left=(i*31-30)+'px';el.style.height=(28+(i*11)%65)+'px';if(i%11===0)el.className='active';document.getElementById('rails').append(el);rails.push(el);}
const clamp=n=>Math.min(1,Math.max(0,n)),ease=n=>1-Math.pow(1-clamp(n),3);
let data,active=-1;
window.prepare=async()=>{
 data=await(await fetch('timeline.json')).json();await document.fonts.ready;
 return data.duration;
};
function draw(t){
 const index=Math.max(0,data.scenes.findIndex(s=>t>=s.start&&t<s.end));const s=data.scenes[index],local=t-s.start,p=clamp(local/s.duration),entry=ease(local/.65),exit=clamp((s.duration-local)/.3);
 if(index!==active){
  active=index;document.querySelectorAll('.graphic').forEach(el=>el.style.display='none');
  document.getElementById('frame').style.display=s.kind==='ui'?'block':'none';document.getElementById('headline').style.display=s.kind==='ui'?'block':'none';document.getElementById('corner').style.display=s.kind==='ui'?'flex':'none';document.getElementById('chapter-line').style.display=s.kind==='ui'?'block':'none';
  if(s.kind==='ui'){document.getElementById('headline').textContent=s.title;document.getElementById('scope').textContent=s.scope;}
  else{document.getElementById(s.id).style.display='block';}
 }
 rails.forEach((el,i)=>{el.style.top=((i*137+t*(11+i%9))%1260-120)+'px';el.style.opacity=(.15+(i%5)*.1).toString();});
 if(s.kind==='ui'){
  document.getElementById('headline').style.transform=`translateY(${(1-entry)*18}px)`;document.getElementById('headline').style.opacity=(entry*exit).toString();document.getElementById('chapter-line').style.transform=`scaleX(${entry})`;
  const frame=document.getElementById('frame');frame.style.opacity=(entry*exit).toString();frame.style.transform=`translateY(${(1-entry)*28}px)`;

 }else{
  const el=document.getElementById(s.id);el.style.opacity=(entry*exit).toString();const heading=el.querySelector('h1');heading.style.transform=`translateY(${(1-entry)*35}px)`;heading.querySelector('span').style.opacity=ease((local-.35)/.65).toString();
  el.querySelectorAll('.pain-card').forEach((card,i)=>{const f=ease((local-.5-i*.2)/.9);card.style.transform=`translateY(${(1-f)*90+Math.sin(local*.7+i)*7}px) rotate(${(i-1)*3}deg)`;card.style.opacity=f.toString();});
  el.querySelectorAll('.route-card').forEach((card,i)=>{const f=ease((local-.5-i*.18)/.8);card.style.transform=`translateY(${(1-f)*85}px) rotate(${Math.sin(local*.55+i)*2}deg)`;card.style.opacity=f.toString();});
  if(s.id==='privacy-pain')document.getElementById('privacy-dot').style.left=(160+clamp((local-1)/3)*1500)+'px';
  if(s.id==='paperwork-pain')document.getElementById('paper-dot').style.left=(180+((local*540)%1460))+'px';
  const emblem=el.querySelector('.brand-emblem');if(emblem)emblem.style.transform=`scale(${.85+.15*entry+Math.sin(local*.8)*.012})`;
 }
 document.getElementById('progress').style.width=(100*t/data.duration)+'%';
}
window.start=()=>{const start=performance.now();document.body.classList.add('ready');window.finished=false;function tick(){const t=Math.min((performance.now()-start)/1000,data.duration-.001);draw(t);if(t<data.duration-.02)requestAnimationFrame(tick);else{window.finished=true;}}requestAnimationFrame(tick);};
window.poster=()=>{document.body.classList.add('ready');const s=data.scenes.find(s=>s.id==='brand');draw(s.start+2);};
</script></body></html>
